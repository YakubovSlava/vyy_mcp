<!doctype html>
<html lang="en">
<head>
  <script>
    // See templates/base.html for why: relative links only resolve
    // correctly once the current URL ends in "/".
    if (!location.pathname.endsWith("/")) {
      location.replace(location.pathname + "/" + location.search + location.hash);
    }
  </script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MJApp (Lab edition) — Sign in</title>
  <style>
    :root {
      --mj-blue: #2766ED;
      --ink: #141416;
      --bg: #EEEFF2;
      --card: #FFFFFF;
      --border: #E2E3E8;
      --muted: #6B6E76;
      --danger: #D64545;
      --danger-bg: #FCEBEB;
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem 2.2rem;
      width: min(360px, calc(100vw - 2rem));
      box-shadow: 0 20px 48px rgba(20, 20, 22, 0.08);
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 0.2rem;
    }
    .logo .mj { color: var(--mj-blue); }
    .logo .rest { color: var(--ink); }
    .edition { color: var(--muted); font-weight: 500; font-size: 0.9rem; margin-bottom: 1.5rem; }

    label { display: block; font-size: 0.82rem; font-weight: 500; margin-bottom: 1rem; }
    input[type=text], input[type=password] {
      width: 100%;
      padding: 0.6rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
      margin-top: 0.3rem;
      font-family: inherit;
    }

    .banner.err {
      background: var(--danger-bg);
      color: var(--danger);
      border-radius: 10px;
      padding: 0.6rem 0.8rem;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }

    .btn.primary {
      width: 100%;
      border: none;
      border-radius: 8px;
      padding: 0.65rem 1rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      background: var(--mj-blue);
      color: #fff;
      margin-top: 0.3rem;
    }
    .btn.primary:hover { background: #1E55CC; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"><span class="mj">MJ</span><span class="rest">App</span></div>
    <div class="edition">(Lab edition)</div>

    {% if error %}<div class="banner err">Incorrect username or password.</div>{% endif %}

    <form method="post" action="login">
      <label>
        Username
        <input type="text" name="username" autocomplete="username" required autofocus />
      </label>
      <label>
        Password
        <input type="password" name="password" autocomplete="current-password" required />
      </label>
      <button type="submit" class="btn primary">Sign in</button>
    </form>
  </div>
</body>
</html>
